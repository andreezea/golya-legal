<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Correo confirmado — GolYa</title>
<style>
:root{--g:#064032;--l:#b9e84a;--t:#1d2a26;--m:#5b6b66;--b:#fdfdfb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--b);line-height:1.65}
header{background:var(--g);color:#fff;padding:28px 20px}header h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;color:#cfe3da}
main{max-width:760px;margin:0 auto;padding:24px 20px 56px}h2{margin-top:2rem;font-size:1.2rem;color:var(--g)}
a{color:var(--g)}li{margin:.3rem 0}.box{background:#eef6e2;border-left:4px solid var(--l);padding:12px 16px;border-radius:6px}
footer{max-width:760px;margin:0 auto;padding:0 20px 40px;color:var(--m);font-size:.9rem}
@media(prefers-color-scheme:dark){:root{--t:#e8efec;--m:#9db0a9;--b:#0e1714}h2{color:var(--l)}a{color:var(--l)}.box{background:#16261f}}
</style>
</head><body>
<header><h1>GolYa</h1><p>Reserva tu cancha en minutos</p></header>
<main>
<h2>Tu correo fue confirmado ✔</h2>
<p>Ya puedes volver a la aplicación GolYa e iniciar sesión con tu correo y contraseña.</p>
<p class="box">Si el enlace dice que venció o no es válido, abre la app e inicia sesión para pedir uno nuevo.</p>
</main>
<footer>© 2026 GolYa</footer>
</body></html>
